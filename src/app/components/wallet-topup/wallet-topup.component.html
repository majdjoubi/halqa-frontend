<div class="wallet-topup-container mt-5">
  <div class="payment-card">
    <h2>شحن المحفظة</h2>

    <!-- رسائل النجاح والخطأ -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <!-- نموذج الدفع -->
    <form (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <!-- إدخال المبلغ -->
      <div class="form-group">
        <label for="amount">المبلغ (USD)</label>
        <input
          type="number"
          id="amount"
          [(ngModel)]="amount"
          name="amount"
          min="1"
          step="0.01"
          placeholder="أدخل المبلغ"
          [disabled]="isProcessing"
          (ngModelChange)="onAmountChange()"
          required
        />
      </div>

      <!-- اختيار طريقة الدفع -->
      <div class="form-group payment-method-selector">
        <label>طريقة الدفع</label>
        <div class="payment-methods">
          <button
            type="button"
            class="payment-method-btn"
            [class.active]="paymentMethod === 'stripe'"
            (click)="selectPaymentMethod('stripe')"
            [disabled]="isProcessing"
          >
            <i class="fab fa-cc-stripe"></i>
            <span>بطاقة ائتمان</span>
          </button>
          <button
            type="button"
            class="payment-method-btn paypal-btn"
            [class.active]="paymentMethod === 'paypal'"
            [class.disabled]="!paypalReady"
            (click)="selectPaymentMethod('paypal')"
            [disabled]="isProcessing || !paypalReady"
          >
            <i class="fab fa-paypal"></i>
            <span>PayPal</span>
            <span *ngIf="paypalLoading" class="loading-indicator">...</span>
          </button>
        </div>
      </div>

      <!-- بيانات البطاقة (Stripe Card Element) -->
      <div class="form-group" *ngIf="paymentMethod === 'stripe'">
        <label>بيانات البطاقة</label>
        <div id="card-element" class="card-element">
          <!-- Stripe Card Element سيظهر هنا -->
        </div>
        <div *ngIf="cardErrors" class="card-errors">
          {{ cardErrors }}
        </div>
      </div>

      <!-- PayPal Button Container -->
      <div class="form-group paypal-container" *ngIf="paymentMethod === 'paypal'">
        <div id="paypal-button-container" class="paypal-buttons">
          <!-- PayPal buttons will be rendered here -->
        </div>
        <p *ngIf="!amount || amount <= 0" class="paypal-hint">
          أدخل المبلغ أولاً لإظهار زر الدفع
        </p>
      </div>

      <!-- زر الدفع (Stripe فقط) -->
      <button
        *ngIf="paymentMethod === 'stripe'"
        type="submit"
        class="submit-btn"
        [disabled]="isProcessing || !amount || amount <= 0"
      >
        <span *ngIf="!isProcessing">شحن المحفظة</span>
        <span *ngIf="isProcessing">جاري المعالجة...</span>
      </button>
    </form>

    <!-- معلومات الأمان -->
    <div class="security-info">
      <p>🔒 جميع المعاملات محمية بتشفير SSL</p>
      <p *ngIf="paymentMethod === 'stripe'">💳 نستخدم Stripe لمعالجة الدفع بشكل آمن</p>
      <p *ngIf="paymentMethod === 'paypal'">💳 نستخدم PayPal لمعالجة الدفع بشكل آمن</p>
    </div>
  </div>
</div>
