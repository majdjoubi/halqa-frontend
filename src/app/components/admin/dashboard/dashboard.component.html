<div class="admin-dashboard container">
  <h5 class="admin-dashboard__title pt-4">Dashboard</h5>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="loading-text">جاري تحميل البيانات...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="hasError && !isLoading" class="error-container">
    <i class="fas fa-exclamation-triangle error-icon"></i>
    <p class="error-text">{{ errorMessage }}</p>
    <button class="btn btn-primary retry-btn" (click)="retryLoad()">
      <i class="fas fa-redo me-2"></i>إعادة المحاولة
    </button>
  </div>

  <!-- Dashboard Content -->
  <ng-container *ngIf="!isLoading && !hasError">
    <app-dash-board-cards [cards]="cards"></app-dash-board-cards>

    <section class="dashboard-charts mt-4">
      <div class="charts-row">
        <div class="chart-col chart-col--wide">
          <div class="chart-card">
            <h6 class="chart-title">
              <i class="fas fa-chart-area me-2"></i>Platform Growth
            </h6>
            <app-spline-chart
              [series]="chartSeries"
              [categories]="chartCategories"
            ></app-spline-chart>
          </div>
        </div>
        <div class="chart-col chart-col--narrow">
          <div class="chart-card">
            <app-bar-chart
              [series]="barChartSeries"
              [categories]="barChartCategories"
              [title]="barChartTitle"
              headerSubtitle="Bookings Overview"
              [headerValue]="barChartHeaderValue"
            ></app-bar-chart>
          </div>
        </div>
      </div>
    </section>
  </ng-container>
</div>
