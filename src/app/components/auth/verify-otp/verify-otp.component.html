<section class="join-us">
  <div class="container-fluid">
    <div class="row min-vh-100">
      <!-- Main Content -->
      <div
        class="verify-otp col-lg-7 col-md-7 col-12 d-flex flex-column justify-content-center p-4"
      >
        <div class="otp-container">
          <h2 class="otp-title">{{ "verify_otp.title" | translate }}</h2>
          <p class="otp-subtitle">
            {{ "verify_otp.description" | translate }}
          </p>
          <p class="otp-email" *ngIf="email">{{ email }}</p>

          <!-- Error Message -->
          <div class="alert alert-danger" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <!-- Success Message -->
          <div class="alert alert-success" *ngIf="successMessage">
            {{ successMessage }}
          </div>

          <form class="otp-form" (ngSubmit)="verifyOtp()">
            <div class="otp-inputs">
              <input
                type="text"
                class="otp-input"
                maxlength="1"
                #otpInput
                name="otp0"
                (input)="onOtpInput($event, 0)"
                (keydown)="onOtpKeyDown($event, 0)"
                (paste)="onOtpPaste($event)"
                autocomplete="off"
                [disabled]="isLoading"
              />
              <input
                type="text"
                class="otp-input"
                maxlength="1"
                #otpInput
                name="otp1"
                (input)="onOtpInput($event, 1)"
                (keydown)="onOtpKeyDown($event, 1)"
                autocomplete="off"
                [disabled]="isLoading"
              />
              <input
                type="text"
                class="otp-input"
                maxlength="1"
                #otpInput
                name="otp2"
                (input)="onOtpInput($event, 2)"
                (keydown)="onOtpKeyDown($event, 2)"
                autocomplete="off"
                [disabled]="isLoading"
              />
              <input
                type="text"
                class="otp-input"
                maxlength="1"
                #otpInput
                name="otp3"
                (input)="onOtpInput($event, 3)"
                (keydown)="onOtpKeyDown($event, 3)"
                autocomplete="off"
                [disabled]="isLoading"
              />
              <input
                type="text"
                class="otp-input"
                maxlength="1"
                #otpInput
                name="otp4"
                (input)="onOtpInput($event, 4)"
                (keydown)="onOtpKeyDown($event, 4)"
                autocomplete="off"
                [disabled]="isLoading"
              />
              <input
                type="text"
                class="otp-input"
                maxlength="1"
                #otpInput
                name="otp5"
                (input)="onOtpInput($event, 5)"
                (keydown)="onOtpKeyDown($event, 5)"
                autocomplete="off"
                [disabled]="isLoading"
              />
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="timer-container">
                <span class="timer" *ngIf="!canResend">
                  {{ formatTime(countdown) }}
                </span>
              </div>

              <div class="resend-container">
                <span class="resend-disabled" *ngIf="!canResend">
                  {{ "verify_otp.resend" | translate }}
                </span>
                <a href="#" *ngIf="canResend && !isLoading"
                  (click)="onResendCode(); $event.preventDefault()">
                  <span class="resend-link">
                    {{ "verify_otp.resend" | translate }}
                  </span>
                </a>
              </div>
            </div>

            <button type="submit" class="confirm-btn" [disabled]="isLoading || getOtpValue().length !== 6">
              <span *ngIf="!isLoading">{{ "verify_otp.verify" | translate }}</span>
              <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                {{ "common.loading" | translate }}
              </span>
            </button>
          </form>
        </div>
      </div>

      <!-- Side Image - Hidden on mobile -->
      <div class="col-lg-5 col-md-5 d-none d-md-block">
        <app-forget-img></app-forget-img>
      </div>
    </div>
  </div>
</section>
