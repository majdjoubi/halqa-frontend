<section class="join-us">
  <div class="container-fluid">
    <div class="row min-vh-100">
      <!-- Main Content -->
      <div
        class="join-us-text col-lg-7 col-md-7 col-12 d-flex flex-column justify-content-center p-4"
      >
        <div class="forget-password-container">
          <div class="header-section text-center mb-4">
            <h1>{{ "forget_password.title" | translate }}</h1>
            <p class="text-muted">
              {{ "forget_password.description" | translate }}
            </p>
          </div>

          <!-- Error Message -->
          <div class="alert alert-danger" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

          <!-- Success Message -->
          <div class="alert alert-success" *ngIf="successMessage">
            {{ successMessage }}
          </div>

          <div class="form-container">
            <form
              class="forget-password-form"
              [formGroup]="forgetPasswordForm"
              (ngSubmit)="onSubmit()"
            >
              <div class="form-group mb-3">
                <label for="email" class="form-label">{{
                  "forget_password.email" | translate
                }}</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  [class.is-invalid]="email?.invalid && email?.touched"
                  [class.is-valid]="email?.valid && email?.touched"
                  [placeholder]="
                    'forget_password.email_placeholder' | translate
                  "
                  formControlName="email"
                  [disabled]="isLoading"
                />
                <div
                  class="invalid-feedback"
                  *ngIf="email?.invalid && email?.touched"
                >
                  <small *ngIf="email?.errors?.['required']">
                    {{ "validation.field_required" | translate }}
                  </small>
                  <small *ngIf="email?.errors?.['email']">
                    {{ "validation.invalid_email" | translate }}
                  </small>
                </div>
                <div
                  class="valid-feedback"
                  *ngIf="email?.valid && email?.touched"
                >
                  {{ "validation.field_valid" | translate }}
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-primary w-100 send-btn"
                [disabled]="forgetPasswordForm.invalid || isLoading"
              >
                <span *ngIf="!isLoading">{{ "forget_password.send" | translate }}</span>
                <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center gap-2">
                  <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                  {{ "common.loading" | translate }}
                </span>
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Side Image - Hidden on mobile -->
      <div class="col-lg-5 col-md-5 d-none d-md-block">
        <app-forget-img></app-forget-img>
      </div>
    </div>
  </div>
</section>
